<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="The first signal from the digital darkness. A simple page where a great journey begins."
    >
    <title>Hello, World — Deep Space</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="cosmos" aria-hidden="true">
      <div class="nebula"></div>
      <div class="orbit orbit--one"></div>
      <div class="orbit orbit--two"></div>
    </div>

    <main class="hero">
      <p class="transmission">DEEP SPACE TRANSMISSION · 001</p>

      <h1>HELLO, <span>WORLD.</span></h1>

      <p class="message">
        The first signal from the digital darkness. A simple page where a great
        journey begins.
      </p>

      <button id="receive-signal" type="button">Receive signal</button>
      <p id="signal-status" class="signal-status" aria-live="polite"></p>
    </main>
  </body>
</html>
